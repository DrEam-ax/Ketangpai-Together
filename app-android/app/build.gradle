plugins {
  id 'com.android.application'
}

android {
  namespace 'com.ktp.scanner'
  compileSdk 35

  defaultConfig {
    applicationId "com.ktp.scanner"
    minSdk 24
    targetSdk 35
    versionCode 28
    versionName "0.6.3"

    // 只留真机在用的 CPU 架构。
    // ML Kit 的 libbarhopper_v3.so 每个架构 3~6MB，x86/x86_64 是模拟器专用的，
    // 打进包里纯属浪费 —— 实测白占 12MB（25.8MB -> 13.7MB）。
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a'
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      // 开混淆 + 裁剪：ML Kit 的 Java 层让 classes.dex 有 9MB，
      // 走一次 R8 能砍掉相当一部分（库自带 consumer rules，不用手写 keep）。
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // 用 debug 签名，方便直接装真机测试
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  packagingOptions {
    resources.excludes += ['META-INF/*.kotlin_module']
  }
}

dependencies {
  implementation 'com.google.zxing:core:3.5.3'
  // ML Kit 的条码检测：神经网络检测，作为最后兜底。
  // 注意：实测它在「屏幕上的高密度二维码」这一场景认不出来（处理 266 帧、零失败、零命中），
  // 真正解决问题的是下面的 zxing-cpp 原生库。留着它是因为它在别的场景仍然可能有用。
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  // zxing-cpp 原生库（app/src/main/jniLibs/），由 tools/zxing-cpp-build 编出
}
