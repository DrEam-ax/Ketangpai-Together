<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>课堂派签到</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>课堂派签到</h1>
      <div class="sub" id="env"></div>
    </header>

    <main>
      <div class="card">
        <div class="row">
          <b>要签的人</b>
          <label class="dim small"><input type="checkbox" id="all" checked /> 全选</label>
          <span class="dim small" id="count"></span>
        </div>
        <div id="accounts" class="accounts"></div>

        <button class="big" id="scan">扫一扫签到</button>
        <p class="dim small center">对准大屏上的二维码，识别到会自动签到</p>

        <div id="result"></div>
      </div>

      <div class="card">
        <details id="addbox">
          <summary>添加账号</summary>
          <div class="stack">
            <input id="k" placeholder="备注名，如 小王" />
            <input id="e" placeholder="课堂派手机号" />
            <input id="p" type="password" placeholder="密码" />
            <button id="add">添加并验证登录</button>
          </div>
          <p class="dim small" id="addhint">会先真实登录一次，成功才保存到本机。</p>
        </details>
      </div>

      <div class="card">
        <details id="ipbox">
          <summary>IP 设置</summary>
          <div class="stack">
            <label class="dim small">签到时报给课堂派的 IP（教师端考勤表里能看到这一列）</label>
            <select id="ipmode">
              <option value="perAccount">每个账号各自一个固定 IP（推荐）</option>
              <option value="same">所有账号共用同一个 IP</option>
              <option value="real">不伪造，用手机真实 IP</option>
            </select>
            <div class="dim small" id="iphint"></div>
            <button id="reroll" class="ghost">重新随机所有 IP</button>
          </div>
        </details>
      </div>

      <div class="card">
        <b class="small dim">日志</b>
        <div id="log" class="log"></div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
